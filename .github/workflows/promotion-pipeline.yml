name: Branch Promotion Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - integration
      - lab
      - release
      - main

permissions:
  contents: read

concurrency:
  group: promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration PR (work -> integration)
    if: >
      github.event.pull_request.draft == false &&
      github.base_ref == 'integration' &&
      github.head_ref == 'work'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trackroute-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trackroute-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --watch=false

      - name: Build app
        run: npm run build

  laboratory:
    name: Laboratory PR (integration -> lab)
    if: >
      github.event.pull_request.draft == false &&
      github.base_ref == 'lab' &&
      github.head_ref == 'integration'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trackroute-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trackroute-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run coverage tests
        run: npm run test:cov

      - name: Build production bundle
        run: npm run build:prod

  release:
    name: Release PR (lab -> release)
    if: >
      github.event.pull_request.draft == false &&
      github.base_ref == 'release' &&
      github.head_ref == 'lab'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trackroute-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trackroute-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --watch=false

      - name: Build production bundle
        run: npm run build:prod

  main:
    name: Main PR (release -> main)
    if: >
      github.event.pull_request.draft == false &&
      github.base_ref == 'main' &&
      github.head_ref == 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trackroute-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trackroute-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run coverage tests
        run: npm run test:cov

      - name: Build production bundle
        run: npm run build:prod
